name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt ruff
      - name: Lint
        run: ruff check backend ml
      - name: Train model (reproducibility check)
        run: python ml/train.py --out /tmp/artifacts
      - name: Unit tests
        run: cd backend && pytest -q

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test API through nginx
        run: |
          curl -fs http://localhost:8081/api/health
          curl -fs -X POST http://localhost:8081/api/predict -H 'Content-Type: application/json' \
            -d '{"s_2":642.5,"s_3":1590,"s_4":1410,"s_7":553,"s_8":2388,"s_11":47.5,"s_12":521.5,"s_13":2388,"s_15":8.42,"s_17":392,"s_20":38.9,"s_21":23.3}'
          curl -fs http://localhost:8081/api/history
      - name: Check Prometheus and Grafana
        run: |
          sleep 15
          curl -fs 'http://localhost:9090/api/v1/query?query=rul_predictions_total' | grep -q rul_predictions_total
          curl -fs http://localhost:3000/api/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  publish:
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
