<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbofan RUL Predictor</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#1c1c1c}
  h1{font-size:1.5rem} form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem}
  label{display:flex;flex-direction:column;font-size:.8rem;gap:.2rem}
  input{padding:.4rem;border:1px solid #bbb;border-radius:4px}
  button{margin-top:1rem;padding:.6rem 1.2rem;border:0;border-radius:4px;background:#0b5fff;color:#fff;cursor:pointer}
  #result{margin:1.2rem 0;font-size:1.3rem;font-weight:600}
  table{border-collapse:collapse;width:100%;font-size:.9rem} td,th{border-bottom:1px solid #ddd;padding:.3rem;text-align:left}
</style>
</head>
<body>
<h1>Turbofan Remaining Useful Life</h1>
<p>Enter sensor readings for one engine cycle (defaults are a typical sample).</p>
<form id="f"></form>
<button id="go">Predict RUL</button> <button id="rand" type="button">Randomize</button>
<div id="result"></div>
<h2>Recent predictions</h2>
<table><thead><tr><th>#</th><th>Time</th><th>RUL</th></tr></thead><tbody id="hist"></tbody></table>
<script>
const defaults={s_2:642.5,s_3:1590,s_4:1410,s_7:553,s_8:2388,s_11:47.5,s_12:521.5,s_13:2388,s_15:8.42,s_17:392,s_20:38.9,s_21:23.3};
const f=document.getElementById('f');
for(const [k,v] of Object.entries(defaults))
  f.insertAdjacentHTML('beforeend',`<label>${k}<input name="${k}" type="number" step="any" value="${v}" required></label>`);

async function loadHistory(){
  try{
    const rows=await (await fetch('/api/history')).json();
    document.getElementById('hist').innerHTML=rows.map(r=>`<tr><td>${r.id}</td><td>${new Date(r.created_at).toLocaleString()}</td><td>${r.rul.toFixed(1)}</td></tr>`).join('');
  }catch(e){}
}
document.getElementById('go').onclick=async()=>{
  if(!f.reportValidity())return;
  const body=Object.fromEntries([...new FormData(f)].map(([k,v])=>[k,parseFloat(v)]));
  const out=document.getElementById('result');
  try{
    const r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(await r.text());
    out.textContent=`Predicted RUL: ${(await r.json()).rul} cycles`;
    loadHistory();
  }catch(e){out.textContent='Error: '+e.message}
};
document.getElementById('rand').onclick=()=>{
  for(const i of f.querySelectorAll('input'))i.value=(defaults[i.name]*(1+(Math.random()-.5)*.02)).toFixed(3);
};
loadHistory();
</script>
</body>
</html>
