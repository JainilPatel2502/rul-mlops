services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rulpass}
      POSTGRES_DB: rul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rul -d rul"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${BACKEND_IMAGE:-rul-backend:local}
    environment:
      DATABASE_URL: postgresql://rul:${POSTGRES_PASSWORD:-rulpass}@db:5432/rul
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-rul-frontend:local}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - backend
    ports:
      - "${PROM_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  pgdata:
  promdata:
  grafanadata:
